name: store

# Sends a release's .msixupload to the Microsoft Store: uploads it as a draft, puts the
# release notes on every listing, then commits the submission for certification. The release
# workflow calls this as its last step; run it by hand with a release run's id to send that
# run's build again, such as after a failed submission.
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: The release run whose build to send
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  STORE_APP_ID: 9NFVF39T2447
  STORE_SELLER_ID: "96470620"

jobs:
  store:
    if: vars.STORE_AUTOMATION == 'on'
    runs-on: windows-latest
    env:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
    steps:
      - uses: actions/download-artifact@v7
        if: env.STORE_CLIENT_SECRET != ''
        with:
          name: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Store CLI
        if: env.STORE_CLIENT_SECRET != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Submit
        if: env.STORE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          $upload = (Get-ChildItem msix/*.msixupload | Select-Object -First 1).FullName

          # Upload as a draft first: publishing replaces the draft, so the notes come after.
          # The package file itself is the path; msstore picks its publisher from the extension.
          msstore publish $upload --appId $env:STORE_APP_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "Store upload failed." }

          $notes = Get-Content notes/store.txt -Raw
          $submission = msstore submission get $env:STORE_APP_ID | ConvertFrom-Json
          foreach ($language in $submission.Listings.PSObject.Properties.Name) {
            $submission.Listings.$language.BaseListing.ReleaseNotes = $notes
          }
          $json = $submission | ConvertTo-Json -Depth 100 -Compress
          msstore submission update $env:STORE_APP_ID $json
          if ($LASTEXITCODE -ne 0) { throw "Store notes failed." }

          msstore submission publish $env:STORE_APP_ID
          if ($LASTEXITCODE -ne 0) { throw "Store submission failed." }

      - name: Skipped
        if: env.STORE_CLIENT_SECRET == ''
        run: echo "No STORE_* secrets; the Store was not updated."
