name: winget

# When a release is published (not while it is a draft, so its zip can be downloaded), opens
# a pull request on microsoft/winget-pkgs that moves PHUICMT.Hakari to the new version.
# Needs a WINGET_TOKEN secret: a classic token with the public_repo scope, from an account
# that has a fork of microsoft/winget-pkgs. Without it the job is skipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, such as v0.9.2
        required: true

jobs:
  winget:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ inputs.tag }}" }
          $version = $tag.TrimStart("v")
          $url = "https://github.com/PHUICMT/hakari/releases/download/$tag/Hakari-$version-win-x64.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update PHUICMT.Hakari `
            --version $version `
            --urls $url `
            --release-notes-url "https://github.com/PHUICMT/hakari/releases/tag/$tag" `
            --submit `
            --token $env:WINGET_TOKEN

      - name: Skipped
        if: env.WINGET_TOKEN == ''
        run: echo "No WINGET_TOKEN secret; nothing submitted."
