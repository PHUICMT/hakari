name: release

# A version tag such as v1.0.0 does the whole release, in order:
#   1. test, build the x64 and arm64 zips and the Store upload, write the notes;
#   2. publish the GitHub release with the zips and their checksums;
#   3. open the winget pull request (needs the WINGET_TOKEN secret);
#   4. send the Store submission through store.yml (needs the STORE_* secrets and the
#      repository variable STORE_AUTOMATION set to "on"); store.yml can also be run by hand
#      with this run's id to send the same build again.
# A step whose secret is missing is skipped, so the rest still runs. One workflow, because a
# release published by this workflow's own token would not start another workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release --nologo

      # Notes first: the zips carry them as the "what's new" shown after an update.
      - name: Notes
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            ./tools/Write-ReleaseNotes.ps1 -Tag "${{ github.ref_name }}"
          }
          else {
            New-Item -ItemType Directory -Force artifacts/notes | Out-Null
            "Test build." | Set-Content artifacts/notes/release.md
            "Test build." | Set-Content artifacts/notes/store.txt
          }

      - name: Zips
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            ./tools/Publish-Release.ps1 -Version $env:VERSION -Architecture $arch
            $name = "Hakari-$env:VERSION-win-$arch.zip"
            $hash = (Get-FileHash "artifacts/release/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "artifacts/release/$name.sha256" -Encoding ascii
          }

      - name: Store upload
        shell: pwsh
        run: ./tools/Publish-StoreUpload.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            artifacts/release/*.zip*
            artifacts/msix/*.msixupload
            artifacts/notes/*

  github:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release

      - uses: softprops/action-gh-release@v3
        with:
          name: Hakari ${{ needs.build.outputs.version }}
          body_path: notes/release.md
          files: |
            release/*.zip
            release/*.zip.sha256
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
          draft: false

  winget:
    needs: [build, github]
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $base = "https://github.com/PHUICMT/hakari/releases/download/v$version"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update PHUICMT.Hakari `
            --version $version `
            --urls "$base/Hakari-$version-win-x64.zip" "$base/Hakari-$version-win-arm64.zip" `
            --release-notes-url "https://github.com/PHUICMT/hakari/releases/tag/v$version" `
            --submit `
            --token $env:WINGET_TOKEN

      - name: Skipped
        if: env.WINGET_TOKEN == ''
        run: echo "No WINGET_TOKEN secret; winget not updated."

  store:
    needs: [build, github]
    uses: ./.github/workflows/store.yml
    with:
      run_id: ${{ github.run_id }}
    secrets: inherit
