name: release

# A version tag such as v1.0.0 builds, tests and publishes the portable zip as a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test -c Release --nologo

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          ./tools/Publish-Release.ps1 -Version $version -Architecture x64
          ./tools/Publish-Release.ps1 -Version $version -Architecture arm64
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            $name = "Hakari-$env:VERSION-win-$arch.zip"
            $hash = (Get-FileHash "artifacts/release/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "artifacts/release/$name.sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v7
        with:
          name: Hakari-${{ env.VERSION }}-win
          path: artifacts/release/*.zip*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/release/*.zip*
          generate_release_notes: true
          draft: true
