name: release

# A version tag such as v1.0.0 does the whole release, in order:
#   1. test, build the x64 and arm64 zips and the Store upload, write the notes;
#   2. publish the GitHub release with the zips and their checksums;
#   3. open the winget pull request (needs the WINGET_TOKEN secret);
#   4. send the Store submission (needs the STORE_* secrets and the repository variable
#      STORE_AUTOMATION set to "on"; Individual Partner Center accounts cannot yet link the
#      Entra app the API needs, so until then the .msixupload is left on the run to upload
#      by hand).
# A step whose secret is missing is skipped, so the rest still runs. One workflow, because a
# release published by this workflow's own token would not start another workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  STORE_APP_ID: 9NFVF39T2447
  STORE_SELLER_ID: "96470620"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release --nologo

      # Notes first: the zips carry them as the "what's new" shown after an update.
      - name: Notes
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            ./tools/Write-ReleaseNotes.ps1 -Tag "${{ github.ref_name }}"
          }
          else {
            New-Item -ItemType Directory -Force artifacts/notes | Out-Null
            "Test build." | Set-Content artifacts/notes/release.md
            "Test build." | Set-Content artifacts/notes/store.txt
          }

      - name: Zips
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            ./tools/Publish-Release.ps1 -Version $env:VERSION -Architecture $arch
            $name = "Hakari-$env:VERSION-win-$arch.zip"
            $hash = (Get-FileHash "artifacts/release/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "artifacts/release/$name.sha256" -Encoding ascii
          }

      - name: Store upload
        shell: pwsh
        run: ./tools/Publish-StoreUpload.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            artifacts/release/*.zip*
            artifacts/msix/*.msixupload
            artifacts/notes/*

  github:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release

      - uses: softprops/action-gh-release@v3
        with:
          name: Hakari ${{ needs.build.outputs.version }}
          body_path: notes/release.md
          files: |
            release/*.zip
            release/*.zip.sha256
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
          draft: false

  winget:
    needs: [build, github]
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $base = "https://github.com/PHUICMT/hakari/releases/download/v$version"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update PHUICMT.Hakari `
            --version $version `
            --urls "$base/Hakari-$version-win-x64.zip" "$base/Hakari-$version-win-arm64.zip" `
            --release-notes-url "https://github.com/PHUICMT/hakari/releases/tag/v$version" `
            --submit `
            --token $env:WINGET_TOKEN

      - name: Skipped
        if: env.WINGET_TOKEN == ''
        run: echo "No WINGET_TOKEN secret; winget not updated."

  store:
    needs: [build, github]
    if: vars.STORE_AUTOMATION == 'on'
    runs-on: windows-latest
    env:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
    steps:
      - uses: actions/download-artifact@v7
        if: env.STORE_CLIENT_SECRET != ''
        with:
          name: release

      - name: Store CLI
        if: env.STORE_CLIENT_SECRET != ''
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit
        if: env.STORE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          $upload = (Get-ChildItem msix/*.msixupload | Select-Object -First 1).FullName

          # Upload as a draft first: publishing replaces the draft, so the notes come after.
          msstore publish . --inputFile $upload --appId $env:STORE_APP_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "Store upload failed." }

          $notes = Get-Content notes/store.txt -Raw
          $submission = msstore submission get $env:STORE_APP_ID | ConvertFrom-Json
          foreach ($language in $submission.Listings.PSObject.Properties.Name) {
            $submission.Listings.$language.BaseListing.ReleaseNotes = $notes
          }
          $json = $submission | ConvertTo-Json -Depth 100 -Compress
          msstore submission update $env:STORE_APP_ID $json
          if ($LASTEXITCODE -ne 0) { throw "Store notes failed." }

          msstore submission publish $env:STORE_APP_ID
          if ($LASTEXITCODE -ne 0) { throw "Store submission failed." }

      - name: Skipped
        if: env.STORE_CLIENT_SECRET == ''
        run: echo "No STORE_* secrets; the Store was not updated."
